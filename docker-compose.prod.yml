services:
  db:
    image: postgres:18.3-alpine3.23
    container_name: stock_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${ADMIN_USER}
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_USER: ${API_USER}
      API_USER_PASSWORD: ${API_USER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 10s                # Slightly longer for prod to reduce CPU noise
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_prod:/var/lib/postgresql/
      - ./backend/db_components/init-permissions.sh:/docker-entrypoint-initdb.d/init-permissions.sh
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stock_backend_prod
    restart: always
    environment:
      - ADMIN_DATABASE_URL=postgresql://${ADMIN_USER}:${ADMIN_PASSWORD}@db:5432/${POSTGRES_DB}
      - DATABASE_URL=postgresql://${API_USER}:${API_USER_PASSWORD}@db:5432/${POSTGRES_DB}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_USER=${API_USER}
      - API_USER_PASSWORD=${API_USER_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    # REMOVED: ports mapping. The backend is now fully private.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: stock_frontend_prod
    restart: always
    ports:
      # ONLY the frontend is exposed to the outside world
      - "80:8080"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_prod:
